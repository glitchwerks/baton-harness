[build-system]
# hatchling chosen over setuptools because it has zero config for src/ layout
# (src layout is autodetected), integrates with uv cleanly, and produces
# correct editable installs without legacy shims. No hatch.toml needed for a
# package this small.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codereeve"
dynamic = ["version"]
description = "Disciplined autonomous software-development orchestration."
requires-python = ">=3.10"
# Runtime dependencies: pyyaml and jinja2 are required by the vendored
# symphony package (config.py uses yaml, prompt.py uses jinja2).
# watchfiles is intentionally excluded — the symphony poller is dropped
# in favour of the custom always-on daemon (CLAUDE.md § Upstream dependency).
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "hatchling>=1.27",
    "pytest>=8.0",
    "ruff==0.15.20",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

# `codereeve` is the unified canonical executable. The six `bh-*` scripts are
# temporary compatibility shims for the 0.2 and 0.3 release lines and are
# removed in 0.4.0. New WORKFLOW.md hook lines use `codereeve hook <name>`.
[project.scripts]
codereeve = "codereeve.cli:main"
bh-after-create = "codereeve.legacy_cli:after_create_main"
bh-before-run = "codereeve.legacy_cli:before_run_main"
bh-after-run = "codereeve.legacy_cli:after_run_main"
bh-daemon = "codereeve.legacy_cli:daemon_main"
bh-force-pr-not-merge = "codereeve.legacy_cli:force_pr_not_merge_main"
bh-verify-foundation = "codereeve.legacy_cli:verify_foundation_main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/codereeve", "src/baton_harness"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "D",   # pydocstyle (docstring rules)
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
# stdlib subprocess/json are typed; no third-party stubs needed.
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "fast: branch-level smoke, CLI, policy, and workflow contract tests",
]
